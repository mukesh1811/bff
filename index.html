<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>BFF — Bot Friend Forever</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
    <script type="module" src="./app.js?v=2"></script>
  </head>
  <body>
    <main>
      <h1>bot<br />friend<br />forever</h1>

      <div id="signed-out-view">
        <button id="google-sign-in" type="button" disabled>
          <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 5.38 6.51 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6C44.4 38.03 46.98 31.71 46.98 24.55z" />
            <path fill="#FBBC05" d="M10.53 28.59A14.42 14.42 0 0 1 9.75 24c0-1.6.27-3.15.77-4.59l-7.98-6.2A23.96 23.96 0 0 0 0 24c0 3.87.93 7.51 2.56 10.78l7.97-6.19z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.18 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.97 6.19C6.51 42.62 14.62 48 24 48z" />
          </svg>
          Continue with Google
        </button>
        <p id="auth-message" role="status" aria-live="polite"></p>
      </div>

      <div id="signed-in-view" hidden>
        <p>Hi, <strong id="account-name"></strong>.</p>
        <button id="sign-out" type="button">Sign out</button>
      </div>
    </main>
  </body>
</html>
